[project]
name = "graft"
version = "0.1.0"
description = "Graft agent skills / plugins from one vault onto many agent platforms (Claude Code, Codex, Cursor, OpenCode, pi, ...)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "ruamel.yaml>=0.18",
]

[project.scripts]
graft = "graft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graft"]

[tool.ruff]
line-length = 100
target-version = "py311"
