# Machine-wide grafting: what goes into each platform's *global* skills dir.
# Apply with:  uv run graft apply        (or `graft apply` after `uv tool install -e .`)
#
# Platform ids match the vercel `skills` CLI --agent names. See `graft platforms`.
targets:
  - claude-code
  - codex
  - cursor
  - opencode
  - universal   # ~/.agents/skills, read by amp/cline/zed and used as canonical dir by `npx skills`

skills:
  # ---- vault skills (live in ./skills, symlinked, edits take effect immediately) ----
  searching-github-projects: {to: [claude-code, codex, cursor, opencode, universal]}
  sora: {to: [codex]}
  skill-lookup: {to: [codex]}

  # ---- external skills (not vendored; installed via `npx skills add <source>`) ----
  find-skills:
    source: vercel-labs/skills
    to: [universal]
  mcp-builder:
    source: anthropics/skills
    to: [universal]
  skill-creator:
    source: anthropics/skills
    to: [universal]
  frontend-design:
    source: anthropics/skills
    to: [universal]
  figma-use:
    source: openai/skills
    to: [codex]
  pdf:
    source: openai/skills
    to: [codex]
  playwright:
    source: openai/skills
    to: [codex]
